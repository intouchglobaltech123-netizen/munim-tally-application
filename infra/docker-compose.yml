version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: munim
      POSTGRES_PASSWORD: password
      POSTGRES_DB: munim
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
